name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Nightly rebuild so date-derived content (open today, weekend block,
    # note expiry) stays current without anyone touching the repo.
    - cron: '0 9 * * *' # 09:00 UTC ≈ 4–5am ET
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install, build, and upload your site
        uses: withastro/action@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
